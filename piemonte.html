<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Pipeline — Piemonte</title>
<style>
  body{font-family:sans-serif; max-width:700px; margin:20px auto; padding:0 16px; background:#F7F6F2; color:#1B2430; overflow-x:hidden;}
  .badge{display:inline-block; background:#F3E4D3; color:#B5651D; font-family:monospace; font-size:11px; padding:3px 8px; margin-bottom:14px;}
  input, select{width:100%; padding:10px; font-size:16px; margin-bottom:12px; box-sizing:border-box; border:1px solid #D8D4C8;}
  button{padding:12px 24px; background:#1B2430; color:white; border:none; font-size:14px; cursor:pointer;}
  .ledger-row{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; padding:8px 0; border-top:1px solid #EFEDE4; font-family:monospace; font-size:14px;}
  .ledger-row > span:first-child{min-width:0; overflow-wrap:break-word; word-break:break-word; flex:1;}
  .ledger-row > span:last-child{flex-shrink:0;}
  .netto{font-size:24px; font-weight:bold; margin:16px 0;}
</style>
</head>
<body>
  <div class="badge">⚠ Test interno del pipeline — non consegna ufficiale. Motore condiviso: motore-fiscale.js</div>
  <h1>Test: Piemonte / Torino</h1>

  <label>RAL (€)</label>
  <input type="number" id="ral" value="35000">
  <label>Mensilità</label>
  <select id="mensilita">
    <option value="12">12</option>
    <option value="13" selected>13</option>
    <option value="14">14</option>
  </select>
  <button onclick="calcolaPagina()">Calcola</button>

  <div id="risultato"></div>

<script src="motore-fiscale.js"></script>
<script>
// Fonti locali a questo test: verificate il 16/08/2026
const SCAGLIONI_PIEMONTE = [[0,15000,0.0162],[15000,28000,0.0268],[28000,50000,0.0331],[50000,Infinity,0.0333]];
// Fonte: regione.piemonte.it, tabella ufficiale 2026-2027, formula verificata a mano
const FONTE_REGIONALE = 'regione.piemonte.it (fonte primaria, tabella 2026-2027) — verificato 16/08/2026';
const SOGLIA_TORINO = 11790;
const FONTE_COMUNALE = 'comune.torino.it (fonte primaria, delibera C.C. n.757/2025) — verificato 16/08/2026';

function addComunaleTorino(imponibile){
  return imponibile > SOGLIA_TORINO ? imponibile * 0.008 : 0;
}

function calcolaPagina(){
  const ral = parseFloat(document.getElementById('ral').value) || 0;
  const mensilita = parseInt(document.getElementById('mensilita').value);
  const r = calcolaNetto(ral, SCAGLIONI_PIEMONTE, addComunaleTorino);

  document.getElementById('risultato').innerHTML = `
    <div class="netto">€ ${Math.round(r.netto/mensilita).toLocaleString('it-IT')} / mese — € ${Math.round(r.netto).toLocaleString('it-IT')} / anno</div>
    <div class="ledger-row"><span>INPS</span><span>− € ${Math.round(r.inps)}</span></div>
    <div class="ledger-row"><span>Imponibile fiscale</span><span>€ ${Math.round(r.imponibile)}</span></div>
    <div class="ledger-row"><span>IRPEF netta</span><span>− € ${Math.round(r.irpefNetta)}</span></div>
    <div class="ledger-row"><span>Addizionale regionale (${FONTE_REGIONALE})</span><span>− € ${Math.round(r.addReg)}</span></div>
    <div class="ledger-row"><span>Addizionale comunale Torino (soglia ${SOGLIA_TORINO}€, ${FONTE_COMUNALE})</span><span>− € ${Math.round(r.addCom)}</span></div>
  `;
}

window.addEventListener('DOMContentLoaded', calcolaPagina);
document.getElementById('ral').addEventListener('input', calcolaPagina);
document.getElementById('mensilita').addEventListener('change', calcolaPagina);
</script>
</body>
</html>
