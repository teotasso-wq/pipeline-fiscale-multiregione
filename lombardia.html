<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Pipeline — Lombardia, comuni multipli</title>
<style>
  body{font-family:sans-serif; max-width:700px; margin:20px auto; padding:0 16px; background:#F7F6F2; color:#1B2430; overflow-x:hidden;}
  .badge{display:inline-block; background:#F3E4D3; color:#B5651D; font-family:monospace; font-size:11px; padding:3px 8px; margin-bottom:14px;}
  input, select{width:100%; padding:10px; font-size:16px; margin-bottom:12px; box-sizing:border-box; border:1px solid #D8D4C8;}
  button{padding:12px 24px; background:#1B2430; color:white; border:none; font-size:14px; cursor:pointer;}
  .ledger-row{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; padding:8px 0; border-top:1px solid #EFEDE4; font-family:monospace; font-size:14px;}
  .ledger-row > span:first-child{min-width:0; overflow-wrap:break-word; word-break:break-word; flex:1;}
  .ledger-row > span:last-child{flex-shrink:0;}
  .netto{font-size:24px; font-weight:bold; margin:16px 0;}
</style>
</head>
<body>
  <div class="badge">⚠ Test interno del pipeline — non consegna ufficiale. Campione di 4 comuni. Motore condiviso: motore-fiscale.js</div>
  <h1>Test: Lombardia, comune selezionabile</h1>

  <label>RAL (€)</label>
  <input type="number" id="ral" value="35000">
  <label>Mensilità</label>
  <select id="mensilita">
    <option value="12">12</option>
    <option value="13" selected>13</option>
    <option value="14">14</option>
  </select>
  <label>Comune</label>
  <select id="comune">
    <option value="milano">Milano</option>
    <option value="bergamo">Bergamo</option>
    <option value="brescia">Brescia</option>
    <option value="cremona">Cremona</option>
  </select>
  <button onclick="calcolaPagina()">Calcola</button>

  <div id="risultato"></div>

<script src="motore-fiscale.js"></script>
<script>
const SCAGLIONI_REGIONALE_LOMBARDIA = [[0,15000,0.0123],[15000,28000,0.0158],[28000,50000,0.0172],[50000,Infinity,0.0173]];

// Campione verificato — data di controllo esplicita per sapere quando ricontrollare
const COMUNI = {
  milano:  { nome: 'Milano',  aliquota: 0.008, soglia: 23000, fonte: 'comune.milano.it (fonte primaria)', verificato: '16/08/2026' },
  bergamo: { nome: 'Bergamo', aliquota: 0.008, soglia: 0,     fonte: 'tuttocalcolo.it → Portale Federalismo Fiscale MEF — soglia 0 confermata da esempio numerico (28.000€ → 224€ = 0,80% pieno)', verificato: '16/08/2026' },
  brescia: { nome: 'Brescia', aliquota: 0.008, soglia: 13000, fonte: 'tuttocalcolo.it → Portale Federalismo Fiscale MEF', verificato: '16/08/2026' },
  cremona: { nome: 'Cremona', aliquota: 0.008, soglia: 12000, fonte: 'comune.cremona.it (fonte primaria, conferma "non costituisce franchigia")', verificato: '16/08/2026' }
};

function calcolaPagina(){
  const ral = parseFloat(document.getElementById('ral').value) || 0;
  const mensilita = parseInt(document.getElementById('mensilita').value);
  const comune = COMUNI[document.getElementById('comune').value];
  const addComunale = (imponibile) => imponibile > comune.soglia ? imponibile * comune.aliquota : 0;

  const r = calcolaNetto(ral, SCAGLIONI_REGIONALE_LOMBARDIA, addComunale);

  document.getElementById('risultato').innerHTML = `
    <div class="netto">€ ${Math.round(r.netto/mensilita).toLocaleString('it-IT')} / mese — € ${Math.round(r.netto).toLocaleString('it-IT')} / anno</div>
    <div class="ledger-row"><span>Comune</span><span>${comune.nome}</span></div>
    <div class="ledger-row"><span>INPS</span><span>− € ${Math.round(r.inps)}</span></div>
    <div class="ledger-row"><span>Imponibile fiscale</span><span>€ ${Math.round(r.imponibile)}</span></div>
    <div class="ledger-row"><span>IRPEF netta</span><span>− € ${Math.round(r.irpefNetta)}</span></div>
    <div class="ledger-row"><span>Addizionale regionale Lombardia</span><span>− € ${Math.round(r.addReg)}</span></div>
    <div class="ledger-row"><span>Addizionale comunale (soglia ${comune.soglia}€, verificato ${comune.verificato}, ${comune.fonte})</span><span>− € ${Math.round(r.addCom)}</span></div>
  `;
}

window.addEventListener('DOMContentLoaded', calcolaPagina);
document.getElementById('comune').addEventListener('change', calcolaPagina);
document.getElementById('ral').addEventListener('input', calcolaPagina);
document.getElementById('mensilita').addEventListener('change', calcolaPagina);
</script>
</body>
</html>
